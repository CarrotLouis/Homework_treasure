<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>寻宝游戏动画</title>
  <style>
    body {
      background: #222;
      color: #fff;
      text-align: center;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }
    #log {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-line;
      padding: 10px;
      border: 1px solid #444;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
      background: #333;
    }
    .character {
      position: absolute;
      top: 300px;
      left: 50px;
      width: 50px;
      height: 50px;
      background: gold;
      border-radius: 50%;
      transition: all 1s ease;
    }
  </style>
</head>
<body>
  <h1>寻宝冒险动画</h1>
  <div class="character" id="player"></div>
  <div id="log"></div>

  <script src="treasure.js"></script>
</body>
</html>
